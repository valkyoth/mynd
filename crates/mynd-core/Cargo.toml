[package]
name = "mynd-core"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Format-neutral no_std image types for the mynd ecosystem."
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/mynd-core"
homepage.workspace = true
repository.workspace = true
keywords = ["image", "codec", "no-std", "graphics"]
categories = ["multimedia::images", "no-std"]
include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[features]
default = []
alloc = []
std = ["alloc"]

[dependencies]
mynd-math.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
