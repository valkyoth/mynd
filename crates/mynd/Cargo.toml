[package]
name = "mynd"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Security-first, resource-bounded no_std image codecs and processing."
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/mynd"
homepage.workspace = true
repository.workspace = true
keywords = ["image", "codec", "no-std", "graphics"]
categories = ["multimedia::images", "no-std"]
include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[features]
default = []
alloc = ["mynd-core/alloc"]
std = ["alloc", "mynd-core/std"]

[dependencies]
mynd-core.workspace = true
mynd-math.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
