[package]
name = "mynd-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Checked no_std arithmetic primitives for the mynd ecosystem."
license.workspace = true
readme = "README.md"
documentation = "https://docs.rs/mynd-math"
homepage.workspace = true
repository.workspace = true
keywords = ["image", "no-std", "arithmetic", "overflow"]
categories = ["multimedia::images", "no-std"]
include = [
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
